<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>合并 PDF — PDFly 在线工具</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="/" class="nav-logo">📄 PDFly</a>
      <div class="nav-links">
        <a href="/">所有工具</a>
        <a href="/pricing.html" class="btn-upgrade">升级 Pro</a>
      </div>
    </div>
  </nav>

  <div class="container tool-page">
    <div id="usage-banner"></div>
    <h1>📑 合并 PDF</h1>
    <p class="desc">将多个 PDF 文件合并成一个。拖拽或点击上传文件，支持调整顺序。</p>

    <form id="merge-form">
      <!-- Upload Zone -->
      <div id="upload-zone" class="upload-zone">
        <div class="icon">📄</div>
        <p>点击上传或拖拽 PDF 文件到此处</p>
        <p class="hint">支持 .pdf，最多 10 个文件，每个最大 50MB</p>
      </div>
      <input type="file" id="file-input" accept=".pdf,application/pdf" multiple style="display:none">
      <div id="file-list" style="margin-top:12px;"></div>

      <div id="alert" class="alert"></div>
      <div id="progress-bar" class="progress-bar"><div class="fill"></div></div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:16px;">
        🔗 开始合并
      </button>
    </form>
  </div>

  <script src="/js/app.js"></script>
  <script>
    const uploader = setupUploadZone('upload-zone', 'file-input', 'file-list', 10);
    submitForm('merge-form', '/api/merge', { filename: 'merged.pdf' });
  </script>
</body>
</html>
