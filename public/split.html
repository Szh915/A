<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拆分 PDF — PDFly 在线工具</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="/" class="nav-logo">📄 PDFly</a>
      <div class="nav-links">
        <a href="/">所有工具</a>
        <a href="/pricing.html" class="btn-upgrade">升级 Pro</a>
      </div>
    </div>
  </nav>

  <div class="container tool-page">
    <div id="usage-banner"></div>
    <h1>✂️ 拆分 PDF</h1>
    <p class="desc">按页码范围提取页面。输入如 <code>1-3,5,7-9</code> 提取第 1~3 页、第 5 页、第 7~9 页。</p>

    <form id="split-form">
      <div id="upload-zone" class="upload-zone">
        <div class="icon">📄</div>
        <p>点击上传或拖拽 PDF 文件到此处</p>
        <p class="hint">支持 .pdf，最大 50MB</p>
      </div>
      <input type="file" id="file-input" accept=".pdf,application/pdf" style="display:none">

      <div class="form-group" style="margin-top:20px;">
        <label for="ranges">页面范围</label>
        <input type="text" id="ranges" name="ranges" placeholder="例如: 1-3,5,7-9" value="1-3">
        <p style="font-size:.8rem;color:var(--gray-400);margin-top:4px;">用逗号分隔，减号表示范围。示例: <code>1-3</code> = 第1到3页, <code>1,3,5</code> = 第1、3、5页</p>
      </div>

      <div id="alert" class="alert"></div>
      <div id="progress-bar" class="progress-bar"><div class="fill"></div></div>

      <button type="submit" class="btn btn-primary btn-block btn-lg">
        ✂️ 开始拆分
      </button>
    </form>
  </div>

  <script src="/js/app.js"></script>
  <script>
    setupSingleUpload('upload-zone', 'file-input');
    submitForm('split-form', '/api/split', { filename: 'split.pdf' });
  </script>
</body>
</html>
